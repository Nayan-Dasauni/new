<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For my favourite person</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="music" aria-label="Toggle music" title="Music">🔇</button>
<audio id="audio" loop preload="none"></audio>

<main>
  <section class="fade">
    <p class="hello" id="hello"></p>
    <h1 id="her"></h1>
    <p class="intro" id="intro"></p>
    <p class="tap">🎶 Tap anywhere to start our song</p>

    <p class="counter-label">We've been writing our story for</p>
    <div class="timer">
      <div class="tcard"><b id="d">0</b><span>days</span></div>
      <div class="tcard"><b id="h">0</b><span>hours</span></div>
      <div class="tcard"><b id="m">0</b><span>minutes</span></div>
      <div class="tcard"><b id="s">0</b><span>seconds</span></div>
    </div>
  </section>

  <section>
    <h2>Our little sky of hearts 💖</h2>
    <p class="sub"> Each heart hides a reason I'm crazy about you. Tap to find out. 🧡</p>
    <div class="sky" id="sky"></div>
    <div class="reason dim" id="reason">Tap a heart ✨</div>
  </section>

  <section>
    <h2 style="margin-bottom:18px">A little letter, just for you 💌</h2>
    <div class="letter" id="letter"></div>
  </section>

  <section>
    <h2 id="q"></h2>
    <p class="sub" id="qsub" style="margin-bottom:10px"></p>
    <div class="btns" id="btns">
      <button class="pill yes" id="yes">Yes 💖</button>
      <button class="pill no" id="no">No</button>
    </div>
    <p class="final" id="final"></p>
    <p class="hint" id="hint">Tap anywhere for more love 🧡</p>
  </section>

  <footer id="foot"></footer>
</main>
<div id="cele" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
